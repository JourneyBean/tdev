stages:
  - test
  - build
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: golang:1.27-bookworm

test:
  stage: test
  timeout: 20m
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tmux openssh-server openssh-client openssl zsh
    - mkdir -p /run/sshd
    - useradd --create-home --shell /bin/bash --password '*' developer
    - chown -R developer "$CI_PROJECT_DIR"
  script:
    - runuser -u developer -- env GOCACHE=/tmp/tdev-go-build GOMODCACHE=/tmp/tdev-go-mod make check
    - runuser -u developer -- env GOCACHE=/tmp/tdev-go-build GOMODCACHE=/tmp/tdev-go-mod TDEV_REQUIRE_INTEGRATION=1 go test -race -count=1 -timeout 300s ./...

.release_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'

build_release:
  extends: .release_rules
  stage: build
  timeout: 20m
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssl
  script:
    - sh scripts/gitlab-build.sh
  artifacts:
    name: "tdev-$CI_COMMIT_TAG"
    expire_in: 7 days
    paths:
      - dist/

publish_release:
  extends: .release_rules
  stage: release
  timeout: 20m
  resource_group: tdev-release
  needs:
    - job: build_release
      artifacts: true
  script:
    - go run ./cmd/tdev-gitlab-release --notes "docs/releases/$CI_COMMIT_TAG.md"
